<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deal Breaker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Classic dark overlay to let the card pop */
      background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), url('https://assets.nintendo.com/image/upload/q_auto:best/f_auto/dpr_2.0/store/software/switch/70010000069639/8248e2edec2e8c106a26cb174fd4ae108207cf21ffd6012704f60ef5540cb79c');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: #fff;
    }

    .tracker-container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(226, 27, 34, 0.6); /* Red glowing shadow */
      width: 100%;
      max-width: 450px;
      color: #333;
      text-align: center;
    }

    h2 { 
      margin-top: 0; 
      color: #E21B22; /* Monopoly Red */
      font-size: 36px; 
      border-bottom: 3px solid #000; 
      padding-bottom: 15px; 
      text-transform: uppercase;
      font-weight: 900;
    }
    
    .action-box {
      background-color: #ffe6e6;
      border: 4px solid #E21B22; 
      border-radius: 8px;
      padding: 30px 15px;
      margin-top: 25px;
    }
    
    .action-title {
      font-size: 24px;
      font-weight: bold;
      color: #000;
      margin-bottom: 10px;
    }

    .action-highlight { 
      font-size: 32px; 
      font-weight: 900; 
      color: #E21B22; 
      margin: 0; 
    }

    .description {
      margin-top: 25px;
      background-color: #f8f9fa;
      border-right: 5px solid #000;
      padding: 15px;
      font-size: 18px;
      color: #333;
      line-height: 1.6;
      text-align: right;
      border-radius: 4px;
    }

    .instructions {
      margin-top: 20px;
      font-size: 16px;
      color: #E21B22;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      body { background-attachment: scroll; background-position: top center; }
    }
  </style>
</head>
<body>

  <div class="tracker-container">
    <h2>💥 Deal Breaker! 💥</h2>
    
    <div class="action-box">
      <div class="action-title">Deal Breaker</div>
      <div class="action-highlight">أسرق مجموعة كاملة!</div>
    </div>
    
    <div class="description">
      <strong>إيه اللي بيحصل دلوقتي؟</strong><br>
      من حقك تاخد أي مجموعة أملاك كاملة من أي لاعب تاني في اللعبة وتبقى بتاعتك. غير لو معاه!
      Just say no
    </div>

    <!-- <p class="instructions">
      (وري الشاشة دي للّعيبة واسرق أملاكهم براحتك! 😎)
    </p> -->
  </div>

</body>
</html>
